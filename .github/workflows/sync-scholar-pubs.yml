name: Sync Scholar publications

on:
  schedule:
    - cron: "20 0 * * 1"
  workflow_dispatch:

jobs:
  sync-pubs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync papers.bib from arXiv and Google Scholar
        shell: bash
        run: |
          set +e
          timeout 120 python bin/sync_scholar_pubs.py --write
          status=$?
          set -e
          if [ $status -eq 0 ]; then
            echo "Publication sync succeeded."
          else
            echo "Full sync failed (exit $status); retrying arXiv only."
            python bin/sync_scholar_pubs.py --write --skip-scholar
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if papers.bib changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "Add publications found on Google Scholar and arXiv"
            git push
          )
