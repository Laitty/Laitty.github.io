name = "laitty-visitor-api"
main = "src/index.js"
compatibility_date = "2026-03-07"

# After `wrangler kv namespace create VISITOR_HISTORY`, paste the id:
# [[kv_namespaces]]
# binding = "VISITOR_HISTORY"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Non-secret config only. Put WRITE_TOKEN via `wrangler secret put WRITE_TOKEN`.
ALLOW_PUBLIC_GET = "true"
